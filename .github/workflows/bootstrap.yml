name: Infra Bootstrap (One-time setup)

#on:
#  workflow_dispatch:
on:
  push:
    branches:
      - dev
jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: us-east-2

      # ------------------------
      # Deploy Base Infra
      # ------------------------
      - name: Deploy Base Infra
        run: |
          aws cloudformation deploy \
            --template-file cft/base-infra.yaml \
            --stack-name jsvm-bootstrap-infra \
            --capabilities CAPABILITY_NAMED_IAM

      # ------------------------
      # Initialize SSM
      # ------------------------
      - name: Initialize SSM Parameters
        run: |
          aws cloudformation deploy \
            --template-file cft/ssm-parameters.yaml \
            --stack-name platform-ssm-init \
            --capabilities CAPABILITY_NAMED_IAM