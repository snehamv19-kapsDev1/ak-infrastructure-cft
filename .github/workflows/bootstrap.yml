name: Bootstrap Infrastructure deployment

on:
  push:
    branches: [dev, test, main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set ENV
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) ENV=dev ;;
            test) ENV=test ;;
            main) ENV=prod ;;
          esac
          echo "ENV=$ENV" >> $GITHUB_ENV

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Put SSM Parameters
        run: |
          aws ssm put-parameter \
            --name "/${ENV}/code-artifacts-bucket" \
            --value "${ENV}-jsvm-code-artifacts" \
            --type "String" \
            --overwrite
      
          aws ssm put-parameter \
            --name "/${ENV}/service-name" \
            --value "jsvm" \
            --type "String" \
            --overwrite

      - name: Get bucket from SSM
        run: |
          BUCKET=$(aws ssm get-parameter \
          --name "/${ENV}/code-artifacts-bucket" \
          --query "Parameter.Value" \
          --output text)
          
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Check S3 bucket exists
        run: |
          if aws s3 ls "s3://$BUCKET" 2>/dev/null; then
            echo "BUCKET_EXISTS=true" >> $GITHUB_ENV
          else
            echo "BUCKET_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Print BUCKET_EXISTS
        run: |
          echo "BUCKET_EXISTS=$BUCKET_EXISTS"

#      - name: Deploy Infra
#        if: env.BUCKET_EXISTS == 'false'
#        run: |
#          aws cloudformation deploy \
#            --template-file cfts/jsvm-code-artifact-infra.yaml \
#            --stack-name ${ENV}-jsvm-code-artifact-infra \
#            --capabilities CAPABILITY_NAMED_IAM \
#            --no-fail-on-empty-changeset \
#            --parameter-overrides Environment=$ENV

      - name: Deploy Database Service Lambda
        run: |
          aws cloudformation deploy \
            --template-file cfts/database-service-infra.yaml \
            --stack-name ${ENV}-jsvm-database-service \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=${ENV} \
              CodeBucket=${BUCKET} \
              CodeKey=${CODE_KEY}
