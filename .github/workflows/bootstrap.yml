name: Bootstrap Infrastructure deployment

on:
  push:
    branches: [dev, test, main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # Checkout
      # ----------------------
      - uses: actions/checkout@v4

      # ----------------------
      # ENV SETUP
      # ----------------------
      - name: Set ENV
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) ENV=dev ;;
            test) ENV=test ;;
            main) ENV=prod ;;
          esac
          echo "ENV=$ENV" >> $GITHUB_ENV

      # ----------------------
      # AWS AUTH
      # ----------------------
      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # ----------------------
      # ENSURE SSM CONFIG (SOURCE OF TRUTH)
      # ----------------------
      - name: Ensure SSM config
        run: |
          BUCKET="jsvm-${ENV}-code-artifacts"

          aws ssm put-parameter \
            --name "/jsvm/${ENV}/code-artifacts-bucket" \
            --value "$BUCKET" \
            --type "String" \
            --overwrite

      # ----------------------
      # LOAD CONFIG FROM SSM
      # ----------------------
      - name: Load config from SSM
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/jsvm/${ENV}/code-artifacts-bucket" \
            --query "Parameter.Value" \
            --output text)

          echo "BUCKET=$BUCKET" >> $GITHUB_ENV

      # ----------------------
      # BOOTSTRAP INFRA STACK (IDEMPOTENT CORE)
      # ----------------------
      - name: Deploy Bootstrap Infra Stack
        run: |
          aws cloudformation deploy \
            --template-file cfts/jsvm-code-artifact-infra.yaml \
            --stack-name jsvm-${ENV}-bootstrap \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=$ENV \
              BucketName=$BUCKET

      # ----------------------
      # SET LAMBDA CODE KEY
      # ----------------------
      - name: Set Code Key
        run: |
          echo "CODE_KEY=services/database-service/lambda.zip" >> $GITHUB_ENV

      # ----------------------
      # DEPLOY DATABASE SERVICE STACK (IDEMPOTENT)
      # ----------------------
      - name: Deploy Database Service Lambda
        run: |

          aws cloudformation deploy \
            --template-file cfts/database-service-infra.yaml \
            --stack-name ${ENV}-jsvm-database-service \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=${ENV} \
              CodeBucket=${BUCKET} \
              CodeKey=${CODE_KEY}

      - name: Store API URL in SSM (Service Registry)
        run: |
          DATABASE_SERVICE_API=$(aws cloudformation describe-stacks \
            --stack-name ${ENV}-jsvm-database-service \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseServiceApi'].OutputValue" \
            --output text)
      
          echo "DATABASE_SERVICE_API=DATABASE_SERVICE_API"
      
          aws ssm put-parameter \
            --name "/jsvm/${ENV}/services/database-service/api" \
            --value "DATABASE_SERVICE_API" \
            --type "String" \
            --overwrite