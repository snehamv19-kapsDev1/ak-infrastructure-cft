name: Bootstrap Infrastructure deployment

on:
  push:
    branches: [dev, test, main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # Checkout
      # ----------------------
      - uses: actions/checkout@v4

      # ----------------------
      # ENV SETUP
      # ----------------------
      - name: Set ENV
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) ENV=dev ;;
            test) ENV=test ;;
            main) ENV=prod ;;
          esac
          echo "ENV=$ENV" >> $GITHUB_ENV

      # ----------------------
      # AWS AUTH
      # ----------------------
      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # ----------------------
      # BOOTSTRAP CODE AND DATABASE S3 INFRA STACK
      # ----------------------
      - name: Deploy Bootstrap Infra Stack
        run: |
          aws cloudformation deploy \
            --template-file cfts/jsvm-bootstrap-infra.yaml \
            --stack-name ${ENV}-jsvm-bootstrap-infra \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=$ENV \
              CodeBucketParam=${ENV}-jsvm-code-artifacts \
              DatabaseBucketParam=${ENV}-jsvm-database-jsons
