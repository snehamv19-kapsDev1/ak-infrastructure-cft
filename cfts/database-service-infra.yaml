AWSTemplateFormatVersion: '2010-09-09'
Description: Production Serverless Platform (Lambda + API Gateway + CloudWatch)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]

  CodeBucket:
    Type: String

  CodeKey:
    Type: String

# =========================================================
# IAM ROLE (LAMBDA) - Least Privilege
# =========================================================
Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-database-service-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LambdaLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${CodeBucket}/*"

# =========================================================
# CLOUDWATCH LOG GROUP
# =========================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-database-service"
      RetentionInDays: 14

# =========================================================
# LAMBDA FUNCTION
# =========================================================
  DatabaseServiceFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub "${Environment}-database-service"
      Runtime: python3.11
      Handler: lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 20

      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

      Environment:
        Variables:
          ENV: !Ref Environment
          BUCKET: !Ref CodeBucket

# =========================================================
# API GATEWAY
# =========================================================
  DatabaseServiceApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${Environment}-database-service-api"

# -------------------------
# RESOURCES
# -------------------------
  Item:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ParentId: !GetAtt DatabaseServiceApi.RootResourceId
      PathPart: item

  ItemId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ParentId: !Ref Item
      PathPart: "{id}"

  Items:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ParentId: !GetAtt DatabaseServiceApi.RootResourceId
      PathPart: items

# =========================================================
# CORS (GLOBAL SIMPLE OPTION)
# =========================================================
  OptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref Items
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true

# =========================================================
# LAMBDA INTEGRATION HELP (reused)
# =========================================================
  LambdaInvokeArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Environment}/lambda-arn"
      Type: String
      Value: !GetAtt DatabaseServiceFunction.Arn

# =========================================================
# METHODS (CLEAN PROXY STYLE)
# =========================================================
  CreateItem:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref Item
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations
          - Arn: !GetAtt DatabaseServiceFunction.Arn

  GetItem:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref ItemId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations
          - Arn: !GetAtt DatabaseServiceFunction.Arn

  UpdateItem:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref ItemId
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations
          - Arn: !GetAtt DatabaseServiceFunction.Arn

  DeleteItem:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref ItemId
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations
          - Arn: !GetAtt DatabaseServiceFunction.Arn

  GetItems:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref Items
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations
          - Arn: !GetAtt DatabaseServiceFunction.Arn

# =========================================================
# LAMBDA PERMISSION (TIGHTENED)
# =========================================================
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DatabaseServiceFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*
        - ApiId: !Ref DatabaseServiceApi

# =========================================================
# API DEPLOYMENT (FORCED REDEPLOY SAFE)
# =========================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateItem
      - GetItem
      - UpdateItem
      - DeleteItem
      - GetItems
      - OptionsMethod
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      Description: !Sub "deployment-${Environment}-${AWS::Timestamp}"

# =========================================================
# STAGE
# =========================================================
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref Environment
      RestApiId: !Ref DatabaseServiceApi
      DeploymentId: !Ref ApiDeployment
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: true

# =========================================================
# API GATEWAY ACCOUNT (REQUIRED FOR LOGGING)
# =========================================================
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

# =========================================================
# OUTPUT
# =========================================================
Outputs:
  ApiUrl:
    Value: !Sub "https://${DatabaseServiceApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"