AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap Infrastructure (S3 + SSM Registry)

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  CodeBucketParam:
    Type: String

  DatabaseBucketParam:
    Type: String

  ConfigurationBucketParam:
    Type: String

Resources:

# =========================================================
# CODE ZIP BUCKET
# =========================================================
  CodeBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "${Environment}-${CodeBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

# =========================================================
# DATABASE BUCKET
# =========================================================
  DatabaseBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "${Environment}-${DatabaseBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

# =========================================================
# CONFIGURATION BUCKET
# =========================================================
  ConfigurationBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "${Environment}-${ConfigurationBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"

            AllowedMethods:
              - GET

            AllowedOrigins:
              - "*"

            ExposedHeaders:
              - ETag

            MaxAge: 3000

# =========================================================
# CONFIGURATION BUCKET POLICY
# =========================================================
  ConfigurationBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref ConfigurationBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: PublicReadAccess

            Effect: Allow

            Principal: "*"

            Action:
              - s3:GetObject

            Resource:
              - !Sub "arn:aws:s3:::${ConfigurationBucket}/*"

# =========================================================
# SSM PARAMETERS (SOURCE OF TRUTH)
# =========================================================

  CodeBucketNameParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/code-bucket-name"
      Type: String
      Value: !Ref CodeBucket

  CodeBucketUrlParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/code-bucket-url"
      Type: String
      Value: !Sub "s3://${CodeBucket}"

  DatabaseBucketNameParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/database-bucket-name"
      Type: String
      Value: !Ref DatabaseBucket

  DatabaseBucketUrlParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/database-bucket-url"
      Type: String
      Value: !Sub "s3://${DatabaseBucket}"

# =========================================================
# CONFIGURATION BUCKET SSM PARAMETERS
# =========================================================

  ConfigurationBucketNameParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/configuration-bucket-name"
      Type: String
      Value: !Ref ConfigurationBucket

  ConfigurationBucketUrlParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/configuration-bucket-url"
      Type: String
      Value: !Sub "s3://${ConfigurationBucket}"

# =========================================================
# OUTPUTS
# =========================================================
Outputs:

  CodeBucket:
    Description: Code artifact bucket
    Value: !Ref CodeBucket

  DatabaseBucket:
    Description: Database JSON bucket
    Value: !Ref DatabaseBucket

  ConfigurationBucket:
    Description: Frontend configuration bucket
    Value: !Ref ConfigurationBucket

  ConfigurationBucketUrl:
    Description: Public configuration bucket URL
    Value: !Sub "https://${ConfigurationBucket}.s3.${AWS::Region}.amazonaws.com"