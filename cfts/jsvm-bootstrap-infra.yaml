AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap Infra (S3 + SSM Registry)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]

  CodeBucketParam:
    Type: String

  DatabaseBucketParam:
    Type: String

Resources:

# =========================================================
# CODE ZIP BUCKET
# =========================================================
  CodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-${CodeBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

# =========================================================
# DATABASE BUCKET
# =========================================================
  DatabaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-${DatabaseBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

# =========================================================
# SSM PARAMETERS (SOURCE OF TRUTH)
# =========================================================

  CodeBucketNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Environment}/jsvm/code-bucket"
      Type: String
      Value: !Ref CodeBucket

  CodeBucketUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Environment}/jsvm/code-bucket"
      Type: String
      Value: !Sub "s3://${CodeBucket}"

  DatabaseBucketNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Environment}/jsvm/database-bucket"
      Type: String
      Value: !Ref DatabaseBucket

  DatabaseBucketUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Environment}/jsvm/database-bucket"
      Type: String
      Value: !Sub "s3://${DatabaseBucket}"

# =========================================================
# OUTPUTS (OPTIONAL)
# =========================================================
Outputs:
  CodeBucket:
    Value: !Ref CodeBucket

  DatabaseBucket:
    Value: !Ref DatabaseBucket