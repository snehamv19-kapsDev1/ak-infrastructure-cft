AWSTemplateFormatVersion: '2010-09-09'

Description: Bootstrap Infrastructure (S3 + Cognito + SSM Registry)

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  CodeBucketParam:
    Type: String

  DatabaseBucketParam:
    Type: String

  ConfigurationBucketParam:
    Type: String

  CognitoDomainPrefix:
    Type: String
    Default: jsvm-hms-auth

  FrontendCallbackUrl:
    Type: String
    Default: http://localhost:5173

  FrontendLogoutUrl:
    Type: String
    Default: http://localhost:5173

Resources:

# =========================================================
# CODE ZIP BUCKET
# =========================================================
  CodeBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "${Environment}-${CodeBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

# =========================================================
# DATABASE BUCKET
# =========================================================
  DatabaseBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "${Environment}-${DatabaseBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

# =========================================================
# CONFIGURATION BUCKET
# =========================================================
  ConfigurationBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "${Environment}-${ConfigurationBucketParam}"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"

            AllowedMethods:
              - GET

            AllowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"

            ExposedHeaders:
              - ETag

            MaxAge: 3000

# =========================================================
# CONFIGURATION BUCKET POLICY
# =========================================================
  ConfigurationBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref ConfigurationBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: PublicReadAccess

            Effect: Allow

            Principal: "*"

            Action:
              - s3:GetObject

            Resource:
              - !Sub "arn:aws:s3:::${ConfigurationBucket}/*"

# =========================================================
# COGNITO USER POOL
# =========================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: !Sub "${Environment}-jsvm-user-pool"

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

      Schema:
        - Name: email
          Required: true
          Mutable: true

# =========================================================
# COGNITO USER POOL CLIENT
# =========================================================

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      ClientName: !Sub "${Environment}-jsvm-client"

      UserPoolId: !Ref CognitoUserPool

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - email
        - openid
        - profile

      CallbackURLs:
        - !Ref FrontendCallbackUrl

      LogoutURLs:
        - !Ref FrontendLogoutUrl

      SupportedIdentityProviders:
        - COGNITO

# =========================================================
# COGNITO HOSTED UI DOMAIN
# =========================================================

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain

    Properties:
      Domain: !Sub "${Environment}-${CognitoDomainPrefix}"

      UserPoolId: !Ref CognitoUserPool

# =========================================================
# COGNITO GROUPS
# =========================================================

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      GroupName: ADMIN
      UserPoolId: !Ref CognitoUserPool

  DoctorGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      GroupName: DOCTOR
      UserPoolId: !Ref CognitoUserPool

  PatientGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      GroupName: PATIENT
      UserPoolId: !Ref CognitoUserPool

  ReceptionistGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      GroupName: RECEPTIONIST
      UserPoolId: !Ref CognitoUserPool

# =========================================================
# SSM PARAMETERS (SOURCE OF TRUTH)
# =========================================================

  CodeBucketNameParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/code-bucket-name"
      Type: String
      Value: !Ref CodeBucket

  CodeBucketUrlParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/code-bucket-url"
      Type: String
      Value: !Sub "s3://${CodeBucket}"

  DatabaseBucketNameParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/database-bucket-name"
      Type: String
      Value: !Ref DatabaseBucket

  DatabaseBucketUrlParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/database-bucket-url"
      Type: String
      Value: !Sub "s3://${DatabaseBucket}"

# =========================================================
# CONFIGURATION BUCKET SSM PARAMETERS
# =========================================================

  ConfigurationBucketNameParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/configuration-bucket-name"
      Type: String
      Value: !Ref ConfigurationBucket

  ConfigurationBucketUrlParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/configuration-bucket-url"
      Type: String
      Value: !Sub "s3://${ConfigurationBucket}"

# =========================================================
# COGNITO SSM PARAMETERS
# =========================================================

  CognitoUserPoolIdParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/cognito-user-pool-id"
      Type: String
      Value: !Ref CognitoUserPool

  CognitoClientIdParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/cognito-client-id"
      Type: String
      Value: !Ref CognitoUserPoolClient

  CognitoIssuerParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/cognito-issuer"
      Type: String

      Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

  CognitoHostedUiParam:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub "/${Environment}/jsvm/cognito-hosted-ui"
      Type: String

      Value: !Sub "https://${Environment}-${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

# =========================================================
# OUTPUTS
# =========================================================
Outputs:

  CodeBucket:
    Description: Code artifact bucket
    Value: !Ref CodeBucket

  DatabaseBucket:
    Description: Database JSON bucket
    Value: !Ref DatabaseBucket

  ConfigurationBucket:
    Description: Frontend configuration bucket
    Value: !Ref ConfigurationBucket

  ConfigurationBucketUrl:
    Description: Public configuration bucket URL
    Value: !Sub "https://${ConfigurationBucket}.s3.${AWS::Region}.amazonaws.com"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient

  CognitoIssuer:
    Description: Cognito JWT Issuer

    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

  CognitoHostedUi:
    Description: Cognito Hosted UI URL

    Value: !Sub "https://${Environment}-${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"