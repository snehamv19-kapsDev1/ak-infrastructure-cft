AWSTemplateFormatVersion: '2010-09-09'
Description: Production Serverless Platform (Lambda + API Gateway + CloudWatch)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]

  CodeBucket:
    Type: String

  CodeKey:
    Type: String

Resources:

# =========================================================
# IAM ROLE (LAMBDA)
# =========================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-database-service-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${CodeBucket}/*"

# =========================================================
# LOG GROUP
# =========================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-database-service"
      RetentionInDays: 14

# =========================================================
# LAMBDA
# =========================================================
  DatabaseServiceFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub "${Environment}-database-service"
      Runtime: python3.11
      Handler: lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 20
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          ENV: !Ref Environment
          BUCKET: !Ref CodeBucket

# =========================================================
# API GATEWAY
# =========================================================
  DatabaseServiceApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${Environment}-database-service-api"

# -------------------------
# RESOURCES
# -------------------------
  Item:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ParentId: !GetAtt DatabaseServiceApi.RootResourceId
      PathPart: item

  ItemId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ParentId: !Ref Item
      PathPart: "{id}"

  Items:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ParentId: !GetAtt DatabaseServiceApi.RootResourceId
      PathPart: items

# =========================================================
# METHODS (PROXY)
# =========================================================
  CreateItem:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref Item
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DatabaseServiceFunction.Arn}/invocations

  GetItem:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      ResourceId: !Ref ItemId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DatabaseServiceFunction.Arn}/invocations

# =========================================================
# LAMBDA PERMISSION
# =========================================================
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DatabaseServiceFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DatabaseServiceApi}/*/*

# =========================================================
# API GATEWAY LOGGING ROLE (FIXED)
# =========================================================
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-apigateway-logs-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn: ApiGatewayCloudWatchRole
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

# =========================================================
# DEPLOYMENT (FORCE REDEPLOY FIXED)
# =========================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateItem
      - GetItem
    Properties:
      RestApiId: !Ref DatabaseServiceApi
      Description: !Sub "deployment-${Environment}-${AWS::StackName}"

# =========================================================
# STAGE (FIXED ORDERING)
# =========================================================
  ApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiGatewayAccount
    Properties:
      StageName: !Ref Environment
      RestApiId: !Ref DatabaseServiceApi
      DeploymentId: !Ref ApiDeployment
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: true

# =========================================================
# OUTPUT
# =========================================================
Outputs:
  DatabaseServiceApi:
    Value: !Sub "https://${DatabaseServiceApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"